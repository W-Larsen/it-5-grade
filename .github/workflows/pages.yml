name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lesson pages are written as page bodies (no doctype/head), so wrap them here.
      - name: Build site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp site/index.html _site/index.html
          for dir in lesson-*/; do
            name="${dir%/}"
            [ -f "$name/index.html" ] || continue
            mkdir -p "_site/$name"
            {
              printf '%s\n' '<!doctype html>' '<html lang="uk">' '<head>' \
                '<meta charset="utf-8">' \
                '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
              cat "$name/index.html"
            } > "_site/$name/index.html"
          done
          ls -R _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
